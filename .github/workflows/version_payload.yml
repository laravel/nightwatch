name: Version Payload

on:
  push:
    branches:
      - 1.x

jobs:
  check_changes:
    name: Check for payload changes
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Bump payload version to') }}
    outputs:
      payload_changed: ${{ steps.check-changes.outputs.payload_any_changed }}
      agent_changed: ${{ steps.check-changes.outputs.agent_any_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes in the payload
        id: check-changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            payload:
              agent/src/Payload.php
              src/Payload.php
            agent:
              agent/build/signature.txt

  version_payload:
    name: Version agent payload
    runs-on: ubuntu-latest
    needs: check_changes
    if: ${{ needs.check_changes.outputs.payload_changed }}
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.NIGHTWATCH_PERMISSIONS_APP_ID }}
          private-key: ${{ secrets.NIGHTWATCH_PERMISSIONS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump payload version
        id: payload-version
        if: steps.payload-changed.outputs.any_changed
        run: |
          PAYLOAD_SIGNATURE=$(head -c 7 /dev/urandom | xxd -p)
          echo $PAYLOAD_SIGNATURE > agent/build/payload_signature.txt
          sed -i "s/public const PAYLOAD_SIGNATURE = '.*';/public const PAYLOAD_SIGNATURE = '${PAYLOAD_SIGNATURE}';/" src/Payload.php
          echo "payload_signature=$PAYLOAD_SIGNATURE" >> $GITHUB_OUTPUT

      - name: Build agent
        if: ${{ !needs.check_changes.outputs.agent_changed }}
        shell: bash
        working-directory: ./agent
        run: |
          ./build.sh

      - uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Bump payload version to ${{ steps.payload-version.outputs.signature }}"
          push: true
